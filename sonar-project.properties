sonar.projectName=Mooncell
sonar.sourceEncoding=UTF-8
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.py,frontend/tests/**/*.test.cjs
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**,**/*.d.ts
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
# Node VM/transpileModule tests currently do not provide source-mapped LCOV.
# Add sonar.javascript.lcov.reportPaths only when real TS coverage is available.
sonar.coverage.exclusions=frontend/**
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json,frontend/tsconfig.node.json
